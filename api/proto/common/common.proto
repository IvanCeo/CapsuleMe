syntax = "proto3";

package common;

option go_package = "capsule-me/internal/gen/common";

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

enum Style {
    STYLE_UNSPECIFIED = 0;
    STYLE_CASUAL = 1;
    STYLE_CLASSIC = 2;
    STYLE_SPORT = 3;
}

enum Season {
    SEASON_UNSPECIFIED = 0;
    SEASON_WINTER = 1;
    SEASON_AUTUMN = 2;
    SEASON_SPRING = 3;
    SEASON_SUMMER = 4;
}

enum Palette {
    PALETTE_UNSPECIFIED = 0;
    PALETTE_DARK = 1;
    PALETTE_LIGHT = 2;
    PALETTE_BRIGHT = 3;
}